---
- name: Safe Reboot of Lab Systems
  hosts: all
  become: true
  gather_facts: no

  tasks:
    - name: Issue reboot and wait for nodes to come back online
      ansible.builtin.reboot:
        msg: "Reboot initiated by AWX automation"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 15
        test_command: whoami
