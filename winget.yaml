---
- name: Patch third-party apps via WinGet
  hosts: windows
  gather_facts: false
  become: true
  become_method: runas
  become_user: SYSTEM
  tasks:
    - name: Upgrade machine-scope apps
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false

          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (-not $winget) {
              $winget = Get-ChildItem "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe" -ErrorAction SilentlyContinue |
                  Sort-Object { [version](($_.Directory.Name -split '_')[1]) } -Descending |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $winget) { $Ansible.Failed = $true; Write-Error "WinGet not found"; return }

          $out = & $winget upgrade --all --silent --scope machine --source winget `
                   --accept-package-agreements --accept-source-agreements `
                   --disable-interactivity 2>&1
          $out

          # -1978335189 = 0x8A15002B, nothing to upgrade
          if ($LASTEXITCODE -notin 0, -1978335189) { $Ansible.Failed = $true }
          if ($out -match 'Successfully installed') { $Ansible.Changed = $true }
      async: 3600
      poll: 30
